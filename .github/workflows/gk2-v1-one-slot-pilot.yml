name: Booking 2.0 – One old-style V1 SKU pilot
on:
  push:
    branches:
      - booking-v2-preview-2026-10-24
    paths:
      - '.github/workflows/gk2-v1-one-slot-pilot.yml'
permissions:
  contents: read
concurrency:
  group: gk2-one-slot-pilot-1474-20261103
  cancel-in-progress: false
jobs:
  one-time-old-style-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add no more than one zero-stock future slot
        env:
          GK2_QUICKBUTIK_API_KEY: ${{ secrets.GK2_QUICKBUTIK_API_KEY }}
          GK2_PILOT_WRITE: 'true'
        run: node booking-v2/scripts/pilot-old-variant-add-20261103.mjs
