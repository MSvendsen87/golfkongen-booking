name: Booking 2.0 – Recover abandoned Quickbutik carts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gk2-expired-cart-recovery.yml'
permissions:
  contents: read
concurrency:
  group: gk2-expired-checkout-leases
  cancel-in-progress: false
jobs:
  guarded-lease-recovery:
    # Checkout is now live; always drain expired leases via signed backend.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Signed internal cleanup request (does not create bookings)
        env:
          GK2_QUICKBUTIK_API_KEY: ${{ secrets.GK2_QUICKBUTIK_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createHmac} from 'node:crypto';
          const key=process.env.GK2_QUICKBUTIK_API_KEY||'';
          if(key.length<20)throw Error('Missing existing Quickbutik secret');
          const stamp=String(Math.floor(Date.now()/1000));
          const derived=createHmac('sha256',key)
            .update('gk2-booking-cart-cleanup-key-v1').digest();
          const signature=createHmac('sha256',derived)
            .update('POST:/internal/relock-expired:'+stamp).digest('hex');
          const response=await fetch(
            'https://eadgdcimcmfyuicizboo.supabase.co/functions/v1/gk-booking-v2/internal/relock-expired',
            {method:'POST',headers:{
              'x-gk2-cleanup-timestamp':stamp,
              'x-gk2-cleanup-signature':signature,
              'content-type':'application/json'
            },body:'{}',signal:AbortSignal.timeout(25000)}
          );
          if(!response.ok)throw Error('Cleanup HTTP '+response.status+
            '. Verify both servers use the same Quickbutik API secret.');
          const result=await response.json();
          if(result?.ok!==true||!Number.isInteger(result.closed)||
              !Number.isInteger(result.failed))throw Error('Bad cleanup response');
          console.log('Expired cart cleanup: processed='+result.processed+
            ' relocked='+result.closed+' failed='+result.failed);
          if(result.failed>0)throw Error('Some expired cart variants need manual review');
          NODE
