name: Booking 2.0 – Validate Golfkongen Pushover group (read only)
on:
  push:
    branches:
      - booking-v2-preview-2026-10-24
    paths:
      - '.github/workflows/gk2-pushover-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query signed read-only provider diagnostic (no messages, no codes)
        env:
          GK2_QUICKBUTIK_API_KEY: ${{ secrets.GK2_QUICKBUTIK_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createHmac} from 'node:crypto';
          const key=process.env.GK2_QUICKBUTIK_API_KEY||'';
          if(key.length<20)throw Error('Missing existing signing secret');
          const timestamp=String(Math.floor(Date.now()/1000));
          const derived=createHmac('sha256',key)
            .update('gk2-booking-provider-diagnostics-key-v1').digest();
          const signature=createHmac('sha256',derived)
            .update('POST:/internal/diagnose:'+timestamp).digest('hex');
          const response=await fetch(
           'https://eadgdcimcmfyuicizboo.supabase.co/functions/v1/gk-booking-notifier/internal/diagnose',{
             method:'POST',headers:{
               'x-gk2-diagnostic-timestamp':timestamp,
               'x-gk2-diagnostic-signature':signature,
               'content-type':'application/json'
             },body:'{}',signal:AbortSignal.timeout(55000)
           });
          const report=await response.json();
          const reasons=['ok','key_format_invalid','invalid_app_token','invalid_user_key',
           'no_active_device','invalid_recipient_or_no_device','rate_limited',
           'provider_unavailable','network_error','provider_rejected','group_valid','group_not_found','ambiguous_group','group_no_active_members','groups_api_rejected','groups_api_unavailable','groups_response_invalid','groups_network_error','invalid_app_token_format'];
          console.log('Nuki device:',report?.nukiDevice===true?'OK':'not confirmed');
          console.log('Nuki authorizations:',report?.nukiAuthorizations===true?'OK':'not confirmed');
          console.log('Resend configured:',report?.resendKeyConfigured===true?'OK':'not confirmed');
          console.log('Pushover Golfkongen group:',report?.pushoverRecipient===true?'OK':'not confirmed');
          console.log('Pushover reason:',reasons.includes(report?.pushoverReason)?report.pushoverReason:'no_safe_reason');
          console.log('HTTP:',response.status);
          if(response.status===403)throw Error('Diagnostic signature rejected; verify GitHub and Supabase signing keys');
          if(!report||typeof report.nukiDevice!=='boolean')throw Error('Invalid diagnostic response');
          NODE
