name: Booking 2.0 payment verifier (no deployment)
on:
  pull_request:
    paths:
      - 'booking-v2/supabase/functions/gk-booking-v2/payment-validation*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-order-audit*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-v1-payment-check*.mjs'
      - '.github/workflows/gk2-payment-validation-tests.yml'
      - 'booking-v2/cloudflare/booking-v2-pushover-map*.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test booking-v2/supabase/functions/gk-booking-v2/payment-validation.test.mjs booking-v2/cloudflare/booking-v2-pushover-map.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-order-audit.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-v1-payment-check.test.mjs
