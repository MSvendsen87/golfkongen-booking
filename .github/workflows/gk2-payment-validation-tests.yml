name: Booking 2.0 payment verifier (no deployment)
on:
  push:
    branches: [booking-v2-preview-2026-10-24]
  pull_request:
    paths:
      - 'booking-v2/supabase/functions/gk-booking-v2/payment-validation*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-order-audit*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-v1-payment-check*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-webhook-guard*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/quickbutik-cart-variant*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/cleanup-auth*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-v2/club-priority*.mjs'
      - 'booking-v2/supabase/functions/gk-booking-notifier/*.mjs'
      - '.github/workflows/gk2-payment-validation-tests.yml'
      - 'booking-v2/cloudflare/booking-v2-pushover-map*.mjs'
      - 'booking-v2/scripts/safe-variant-plan*.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test booking-v2/supabase/functions/gk-booking-v2/club-priority.test.mjs booking-v2/storefront-source.test.mjs booking-v2/cart-response.test.mjs booking-v2/supabase/functions/gk-booking-v2/payment-validation.test.mjs booking-v2/cloudflare/booking-v2-pushover-map.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-order-audit.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-v1-payment-check.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-webhook-guard.test.mjs booking-v2/supabase/functions/gk-booking-v2/quickbutik-cart-variant.test.mjs booking-v2/supabase/functions/gk-booking-v2/cleanup-auth.test.mjs booking-v2/scripts/safe-variant-plan.test.mjs booking-v2/supabase/functions/gk-booking-notifier/notify-core.test.mjs booking-v2/supabase/functions/gk-booking-notifier/diagnostic-auth.test.mjs booking-v2/supabase/functions/gk-booking-notifier/pushover-diagnostic.test.mjs booking-v2/supabase/functions/gk-booking-notifier/pushover-group.test.mjs
