name: Booking 2.0 – Hidden-parent cart stock pilot
on:
  push:
    branches:
      - booking-v2-preview-2026-10-24
    paths:
      - '.github/workflows/gk2-cart-stock-pilot.yml'
permissions:
  contents: read
concurrency:
  group: gk2-variants-safe-rollout
  cancel-in-progress: false
jobs:
  guarded-cart-stock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Briefly open only variant 282560 and always restore hidden stock zero
        env:
          GK2_QUICKBUTIK_API_KEY: ${{ secrets.GK2_QUICKBUTIK_API_KEY }}
          GK2_TEST_OPEN_AND_RELOCK: 'true'
        run: node booking-v2/scripts/pilot-v1-cart-stock-window.mjs
