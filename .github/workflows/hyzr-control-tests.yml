name: HYZR control tests
on:
  pull_request:
    paths:
      - 'booking-v2/hyzr-control/**'
      - 'booking-v2/supabase/functions/gk2-hyzr-device-status/**'
      - 'booking-v2/supabase/functions/gk2-hyzr-extension-payment/**'
      - 'booking-v2/sql/05*_gk2_hyzr_*'
      - 'booking-v2/sql/06*_gk2_hyzr_*'
      - 'docs/booking/admin/index.html'
      - '.github/workflows/hyzr-control-tests.yml'
  push:
    branches:
      - 'feature/hyzr-control-safe-stage-20261108'
    paths:
      - 'booking-v2/hyzr-control/**'
      - 'booking-v2/supabase/functions/gk2-hyzr-device-status/**'
      - 'booking-v2/supabase/functions/gk2-hyzr-extension-payment/**'
      - 'booking-v2/sql/05*_gk2_hyzr_*'
      - 'booking-v2/sql/06*_gk2_hyzr_*'
      - 'docs/booking/admin/index.html'
      - '.github/workflows/hyzr-control-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test booking-v2/hyzr-control/*.test.mjs
      - run: node booking-v2/hyzr-control/check-admin-ui.mjs
