<script>
(function () {
  "use strict";
  var hasBooking2 = false;
  {{#order.items}}
  if (Number("{{product_id}}") >= 1474 && Number("{{product_id}}") <= 1506) {
    hasBooking2 = true;
  }
  {{/order.items}}
  if (!hasBooking2) return;
  var match = /^\/success\/([1-9][0-9]{0,8})\/?$/.exec(location.pathname);

  location.replace("https://msvendsen87.github.io/golfkongen-booking/booking/takk/?order=" + encodeURIComponent(match[1]));
})();
</script>
